name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset native
      - name: Build
        run: cmake --build --preset native --parallel 2
      - name: Test
        run: ctest --preset native

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package dependencies
        run: npm ci --prefix packages/cisis-wasm
      - name: Test TypeScript package
        run: npm test --prefix packages/cisis-wasm

  native-32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler runtime
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib
      - name: Configure
        run: cmake --preset native-32
      - name: Build
        run: cmake --build --preset native-32 --parallel 2
      - name: Test
        run: ctest --preset native-32

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: cmake --preset wasm
      - name: Build
        run: cmake --build --preset wasm --parallel 2
      - name: Install and test runtime package
        run: |
          npm ci --prefix packages/cisis-wasm
          npm test --prefix packages/cisis-wasm
          cp build/wasm/cisis-mx.mjs build/wasm/cisis-mx.wasm packages/cisis-wasm/dist/
          cp build/wasm/cisis-wxis.mjs build/wasm/cisis-wxis.wasm packages/cisis-wasm/dist/
      - name: Test generated modules
        run: |
          node tests/wasm/smoke.mjs \
            "$PWD/build/wasm/cisis-mx.mjs" \
            "$PWD/build/wasm/cisis-wxis.mjs" \
            "$PWD"
          node tests/wasm/package-smoke.mjs \
            "$PWD/build/wasm/cisis-mx.mjs" \
            "$PWD/build/wasm/cisis-wxis.mjs" \
            "$PWD"
      - name: Install Chromium
        run: npx --prefix packages/cisis-wasm playwright install --with-deps chromium
      - name: Test browser worker
        run: npm run test:browser --prefix packages/cisis-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: cisis-wasm
          path: |
            build/wasm/*.mjs
            build/wasm/*.wasm
            packages/cisis-wasm/dist/
          if-no-files-found: error
