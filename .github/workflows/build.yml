name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset native
      - name: Build
        run: cmake --build --preset native --parallel 2
      - name: Test
        run: ctest --preset native

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package dependencies
        run: npm ci --prefix packages/cisis-wasm
      - name: Test TypeScript package
        run: npm test --prefix packages/cisis-wasm

  native-32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler runtime
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib
      - name: Configure
        run: cmake --preset native-32
      - name: Build
        run: cmake --build --preset native-32 --parallel 2
      - name: Test
        run: ctest --preset native-32
      - uses: actions/upload-artifact@v4
        with:
          name: cisis-native-32
          path: |
            build/native-32/cisis-mx
            build/native-32/cisis-wxis
          if-no-files-found: error

  wasm:
    needs: native-32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cisis-native-32
          path: build/native-32
      - name: Install 32-bit compatibility runtime
        run: sudo apt-get update && sudo apt-get install --yes libc6-i386
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: cmake --preset wasm
      - name: Build
        run: cmake --build --preset wasm --parallel 2
      - name: Install and test runtime package
        run: |
          npm ci --prefix packages/cisis-wasm
          npm test --prefix packages/cisis-wasm
          cp build/wasm/cisis-mx.mjs build/wasm/cisis-mx.wasm packages/cisis-wasm/dist/
          cp build/wasm/cisis-wxis.mjs build/wasm/cisis-wxis.wasm packages/cisis-wasm/dist/
      - name: Test generated modules
        run: |
          node tests/wasm/smoke.mjs \
            "$PWD/build/wasm/cisis-mx.mjs" \
            "$PWD/build/wasm/cisis-wxis.mjs" \
            "$PWD"
          node tests/wasm/package-smoke.mjs \
            "$PWD/build/wasm/cisis-mx.mjs" \
            "$PWD/build/wasm/cisis-wxis.mjs" \
            "$PWD"
      - name: Test native and WebAssembly compatibility
        run: |
          chmod +x build/native-32/cisis-mx build/native-32/cisis-wxis
          node tests/compat/differential.mjs \
            --native-mx "$PWD/build/native-32/cisis-mx" \
            --native-wxis "$PWD/build/native-32/cisis-wxis" \
            --wasm-mx "$PWD/build/wasm/cisis-mx.mjs" \
            --wasm-wxis "$PWD/build/wasm/cisis-wxis.mjs" \
            --root "$PWD" \
            --report "$PWD/build/compatibility-report.json"
      - name: Measure WebAssembly performance and artifact budgets
        run: |
          node tests/wasm/performance.mjs \
            "$PWD/build/wasm/cisis-mx.mjs" \
            "$PWD/build/wasm/cisis-wxis.mjs" \
            "$PWD" \
            "$PWD/build/performance-report.json"
      - name: Install Chromium
        run: npx --prefix packages/cisis-wasm playwright install --with-deps chromium
      - name: Test browser worker
        run: npm run test:browser --prefix packages/cisis-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: cisis-wasm
          path: |
            build/wasm/*.mjs
            build/wasm/*.wasm
            build/compatibility-report.json
            build/performance-report.json
            packages/cisis-wasm/dist/
          if-no-files-found: error
