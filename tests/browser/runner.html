<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CISIS Wasm worker test</title>
  </head>
  <body>
    <output id="status">Running</output>
    <script type="module">
      import {
        CisisProjectStore,
        CisisRunner,
      } from "/packages/cisis-wasm/dist/index.js";

      const status = document.querySelector("#status");
      const runner = new CisisRunner({ defaultTimeoutMs: 10_000 });

      try {
        const mx = await runner.run({
          program: "mx",
          args: ["seq=utf8.txt", "pft=v1/", "now"],
          files: { "utf8.txt": "This is a test in UTF8\n" },
        });
        const source = await fetch("/wxis_src/examples/hello.xis").then((response) => response.text());
        const wxis = await runner.runIsisScript({ source });
        const isoResponse = await fetch("/wxis_src/examples/cds/cds.iso");
        if (!isoResponse.ok) throw new Error("Failed to load CDS ISO fixture");
        const project = runner.createProject({
          "cds.iso": new Uint8Array(await isoResponse.arrayBuffer()),
        });
        const imported = await project.run({
          program: "mx",
          args: ["iso=cds.iso", "create=cds", "now"],
          returnFiles: ["cds.mst", "cds.xrf"],
        });
        if (imported.exitCode !== 0) throw new Error(imported.stderr || "CDS import failed");

        const store = new CisisProjectStore("cisis-wasm-browser-test");
        await store.save("cds", project.snapshot());
        const persistedProjects = await store.list();
        const snapshot = await store.load("cds");
        if (!snapshot) throw new Error("Persisted CDS project was not found");
        const restored = runner.createProject(snapshot.files);
        await store.delete("cds");
        store.close();

        const formatted = await restored.format({
          database: "cds",
          pft: "mfn(4),'|',v24/",
          count: 2,
        });
        window.__cisisTestResult = {
          mx: { exitCode: mx.exitCode, stdout: mx.stdout, stderr: mx.stderr },
          wxis: { exitCode: wxis.exitCode, stdout: wxis.stdout, stderr: wxis.stderr },
          formatted: {
            exitCode: formatted.exitCode,
            stdout: formatted.stdout,
            stderr: formatted.stderr,
          },
          projectFiles: restored.listFiles(),
          persistedProjects,
        };
        status.value = "Passed";
      } catch (error) {
        window.__cisisTestError = error instanceof Error ? error.message : String(error);
        status.value = "Failed";
      } finally {
        runner.dispose();
      }
    </script>
  </body>
</html>
