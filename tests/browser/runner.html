<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CISIS Wasm worker test</title>
  </head>
  <body>
    <output id="status">Running</output>
    <script type="module">
      import {
        CisisProject,
        CisisProjectStore,
        CisisRunner,
      } from "/packages/cisis-wasm/dist/index.js";

      const status = document.querySelector("#status");
      const runner = new CisisRunner({ defaultTimeoutMs: 10_000 });

      function openDatabase(name, version, upgrade) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(name, version);
          request.onupgradeneeded = () => upgrade?.(request.result);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      try {
        const mx = await runner.run({
          program: "mx",
          args: ["seq=utf8.txt", "pft=v1/", "now"],
          files: { "utf8.txt": "This is a test in UTF8\n" },
        });
        const source = await fetch("/wxis_src/examples/hello.xis").then((response) => response.text());
        const wxis = await runner.runIsisScript({ source });
        const recordFormatted = await runner.formatRecord({
          record: {
            fields: [
              { tag: 24, value: "日本語 title" },
              { tag: 70, value: "Ada" },
              { tag: 70, value: "Grace" },
              { tag: 26, value: "^aParis^bPress" },
            ],
          },
          pft: "v24,'|',(v70+|;|),'|',v26^a,'|',v26^b/",
        });
        const deleteSource = await fetch("/wxis_src/examples/delfile.xis").then(
          (response) => response.text(),
        );
        const deletionProject = runner.createProject({
          "delfile.xis": deleteSource,
          "delete-me.txt": "delete me",
        });
        const deleted = await deletionProject.run({
          program: "wxis",
          args: ["IsisScript=delfile.xis", "file=delete-me.txt"],
          inspectFiles: ["delete-me.txt"],
        });
        const isoResponse = await fetch("/wxis_src/examples/cds/cds.iso");
        if (!isoResponse.ok) throw new Error("Failed to load CDS ISO fixture");
        const project = runner.createProject({
          "cds.iso": new Uint8Array(await isoResponse.arrayBuffer()),
        });
        const imported = await project.run({
          program: "mx",
          args: ["iso=cds.iso", "create=cds", "now"],
          returnFiles: ["cds.mst", "cds.xrf"],
        });
        if (imported.exitCode !== 0) throw new Error(imported.stderr || "CDS import failed");

        const store = new CisisProjectStore("cisis-wasm-browser-test");
        await store.save("cds", project.snapshot());
        const persistedProjects = await store.list();
        const snapshot = await store.load("cds");
        if (!snapshot) throw new Error("Persisted CDS project was not found");
        const archive = project.exportArchive();
        const restored = CisisProject.fromArchive(runner, archive);
        await store.delete("cds");
        store.close();

        const migrationDatabaseName = `cisis-wasm-migration-${crypto.randomUUID()}`;
        const legacyDatabase = await openDatabase(migrationDatabaseName, 1, (database) => {
          const projects = database.createObjectStore("projects", { keyPath: "name" });
          projects.put({
            name: "legacy",
            updatedAt: 1,
            schemaVersion: 1,
            files: { "legacy.txt": new Uint8Array([1, 2, 3]) },
          });
        });
        legacyDatabase.close();
        const migratedStore = new CisisProjectStore(migrationDatabaseName);
        const migrated = await migratedStore.load("legacy");
        const migratedDatabase = await openDatabase(migrationDatabaseName, 2);
        const migratedIndex = migratedDatabase
          .transaction("projects", "readonly")
          .objectStore("projects")
          .indexNames.contains("updatedAt");
        migratedDatabase.close();

        const corruptDatabase = await openDatabase(migrationDatabaseName, 2);
        const corruptTransaction = corruptDatabase.transaction("projects", "readwrite");
        corruptTransaction.objectStore("projects").put({
          name: "corrupt",
          updatedAt: 2,
          schemaVersion: 99,
          files: {},
        });
        await new Promise((resolve, reject) => {
          corruptTransaction.oncomplete = resolve;
          corruptTransaction.onerror = () => reject(corruptTransaction.error);
        });
        corruptDatabase.close();
        let corruptionCode;
        try {
          await migratedStore.load("corrupt");
        } catch (error) {
          corruptionCode = error.code;
        }
        migratedStore.close();

        const editableProject = runner.createProject({
          "catalog.ifp": new Uint8Array([1, 2, 3]),
        });
        await editableProject.writeRecords({
          database: "catalog",
          replace: true,
          records: [
            { mfn: 5, status: "active", fields: [{ tag: 24, value: "日本語 Five" }] },
            { mfn: 9, status: "deleted", fields: [{ tag: 24, value: "Nine" }] },
          ],
        });
        const afterCreate = await editableProject.format({
          database: "catalog",
          pft: "mfn(6),'|',v24/",
        });
        await editableProject.writeRecords({
          database: "catalog",
          records: [
            { mfn: 9, status: "active", fields: [{ tag: 24, value: "Nine updated" }] },
            { mfn: 12, status: "deleted", fields: [{ tag: 24, value: "Twelve" }] },
          ],
        });
        const afterUpdate = await editableProject.format({
          database: "catalog",
          pft: "mfn(6),'|',v24/",
        });

        const formatted = await restored.format({
          database: "cds",
          pft: "mfn(4),'|',v24/",
          count: 2,
        });
        window.__cisisTestResult = {
          mx: { exitCode: mx.exitCode, stdout: mx.stdout, stderr: mx.stderr },
          wxis: { exitCode: wxis.exitCode, stdout: wxis.stdout, stderr: wxis.stderr },
          recordFormatted: {
            exitCode: recordFormatted.exitCode,
            stdout: recordFormatted.stdout,
            stderr: recordFormatted.stderr,
          },
          formatted: {
            exitCode: formatted.exitCode,
            stdout: formatted.stdout,
            stderr: formatted.stderr,
          },
          projectFiles: restored.listFiles(),
          persistedProjects,
          persistedFileCount: Object.keys(snapshot.files).length,
          archiveBytes: archive.byteLength,
          persistenceMigration: {
            fileBytes: [...migrated.files["legacy.txt"]],
            updatedAtIndex: migratedIndex,
            corruptionCode,
          },
          recordEditing: {
            afterCreate: afterCreate.stdout,
            afterUpdate: afterUpdate.stdout,
            files: editableProject.listFiles(),
          },
          deleted: {
            exitCode: deleted.exitCode,
            fileState: deleted.fileStates["delete-me.txt"],
            retained: deletionProject.hasFile("delete-me.txt"),
          },
        };
        status.value = "Passed";
      } catch (error) {
        window.__cisisTestError = error instanceof Error ? error.message : String(error);
        status.value = "Failed";
      } finally {
        runner.dispose();
      }
    </script>
  </body>
</html>
